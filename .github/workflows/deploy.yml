name: Deploy Krona Express to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js 20 com Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar Dependências
        run: pnpm install --frozen-lockfile

      - name: Validação de Tipos (Typecheck)
        run: pnpm exec tsc --noEmit

      - name: Build Estático (Exportação Next.js)
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload de Artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out


